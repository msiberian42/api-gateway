
services:
  api-gateway:
    image: nginx:1.31
    container_name: api-gateway
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      security:
        condition: service_started
      uploader:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  security:
    build:
      context: ./security
    image: security:local
    container_name: security
    environment:
      JWT_SECRET_KEY: "replace-with-a-long-random-secret"
      DATABASE_PATH: /data/users.db
    volumes:
      - security_data:/data
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped

  uploader:
    build:
      context: ./uploader
    image: uploader:local
    container_name: uploader
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: images
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - minio
    networks:
      - backend
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    ports:
      - "9001:9001"
    networks:
      - backend
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - backend
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.26
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    expose:
      - "5601"
    depends_on:
      - elasticsearch
    networks:
      - backend
    restart: unless-stopped

  vector:
    image: timberio/vector:0.53.0-alpine
    container_name: vector
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - backend
    restart: unless-stopped

volumes:
  minio_data:
  security_data:
  elasticsearch_data:

networks:
  backend:
    driver: bridge
