
upstream security {
    server security:8080;
}

upstream uploader {
    server uploader:8080;
}

upstream minio {
    server minio:9000;
}

map $http_authorization $kibana_authenticated {
    default 0;
    "Basic YWRtaW46cXdlcnR5MTIzNDU2" 1;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # Проверка JWT
    location = /_auth {
        internal;

        proxy_pass http://security/v1/token/validation/;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # Регистрация пользователя
    location = /v1/register {
        proxy_pass http://security/v1/user;
    }

    location = /register {
        proxy_pass http://security/v1/user;
    }

    # Авторизация пользователя
    location = /v1/token {
        proxy_pass http://security/v1/token;
    }

    location = /token {
        proxy_pass http://security/v1/token;
    }

    # Получение информации о пользователе
    location = /v1/user {
        auth_request /_auth;

        proxy_pass http://security/v1/user;
    }

    # Загрузка файла
    location = /v1/upload {
        auth_request /_auth;

        proxy_pass http://uploader/v1/upload;
    }

    location = /upload {
        auth_request /_auth;

        proxy_pass http://uploader/v1/upload;
    }

    # Получение изображения
    location ~ ^/v1/user/(.+)$ {
        auth_request /_auth;

        proxy_set_header Authorization "";
        proxy_pass http://minio/images/$1;
    }

    location ~ ^/images/(.+)$ {
        auth_request /_auth;

        proxy_set_header Authorization "";
        proxy_pass http://minio/images/$1;
    }
}

server {
    listen 8081;
    server_name localhost;

    location / {
        if ($kibana_authenticated = 0) {
            return 401;
        }

        add_header WWW-Authenticate 'Basic realm="Kibana"' always;
        proxy_pass http://kibana:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
